  <!-- ===== the car: little convertible, front view, coming towards you ===== -->
  <!-- windscreen frame and glass (she sits behind it) -->
  
  <path d="M19.5 58.5 L52.5 58.5 L56 66.5 L16 66.5 Z" fill="#cfe3f2" opacity=".35"/>
