    <g stroke="var(--ink-2, #4b5373)" stroke-width="1.1" stroke-linecap="round"><path d="M62.6 21.4 l2.5 -1.9"/><path d="M63.4 25.8 l3 0"/><path d="M62.6 30.2 l2.5 1.8"/></g>

